server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name prabhanshu.space www.prabhanshu.space;

    # SSL (managed by certbot, certs auto-renewed via timer)
    ssl_certificate /etc/letsencrypt/live/prabhanshu.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prabhanshu.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Logs
    access_log /var/log/nginx/prabhanshu.space.access.log;
    error_log /var/log/nginx/prabhanshu.space.error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── Auth subrequest (used by /vm routes) ──
    # Returns 200 if logged in, 401 if not
    location = /auth/check {
        internal;
        proxy_pass http://127.0.0.1:8000/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
    }

    # ── Windows VM (auth-protected) ──
    # Proxied via SSH tunnel from desktop:8006 -> VPS localhost:9006
    location /vm/ {
        auth_request /auth/check;
        error_page 401 = @vm_login;

        proxy_pass http://127.0.0.1:9006/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (required for noVNC)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Long timeouts for persistent VNC sessions
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # Redirect to login when not authenticated for /vm
    location @vm_login {
        return 302 /login?next=$request_uri;
    }

    # Redirect /vm to /vm/ (noVNC needs trailing slash for relative assets)
    location = /vm {
        return 301 /vm/;
    }

    # Mobile VM UI — serve index.html for the directory
    location = /vm/mobile/ {
        auth_request /auth/check;
        error_page 401 = @vm_login;

        proxy_pass http://127.0.0.1:9006/mobile/index.html;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /vm/mobile {
        return 301 /vm/mobile/;
    }

    # ── Moonlight Web Stream (auth-protected) ──
    # Proxied via SSH tunnel from desktop:8080 -> VPS localhost:9080
    location /vm/stream/ {
        auth_request /auth/check;
        error_page 401 = @vm_login;

        proxy_pass http://127.0.0.1:9080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (required for WebRTC signaling)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Long timeouts for streaming sessions
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
    location = /vm/stream {
        return 301 /vm/stream/;
    }

    # Life Dashboard - Habit Tracker Frontend
    location /dashboard/habits {
        proxy_pass http://127.0.0.1:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Life Dashboard - Habit Tracker API
    location /dashboard/api/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Voice Typing (PUBLIC) ──
    location /voice-typing/ {
        proxy_pass http://127.0.0.1:8766/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (required for /v1/realtime)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Long timeouts for streaming sessions
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    location = /voice-typing {
        return 301 /voice-typing/;
    }

    # Proxy to FastHTML app
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed later)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name prabhanshu.space www.prabhanshu.space;
    return 301 https://$host$request_uri;
}
